services:
  - type: web
    name: flight-forecast-lab
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    numInstances: 1
    autoDeployTrigger: checksPass
    healthCheckPath: /ready
    envVars:
      - key: MODEL_DIR
        value: /app/artifacts/demo
      - key: EXTERNAL_CONTEXT_ENABLED
        value: "1"
      - key: FLIGHT_OFFER_PROVIDER
        value: auto
      - key: SERPAPI_MONTHLY_LIMIT
        value: "250"
      - key: SITE_ACCESS_USERNAME
        value: flight
      - key: SITE_ACCESS_PASSWORD
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: SEARCHAPI_API_KEY
        sync: false
      - key: SEARCHAPI_LIFETIME_LIMIT
        value: "100"
      - key: SCRAPPA_API_KEY
        sync: false
      - key: SCRAPPA_MONTHLY_LIMIT
        value: "500"
      - key: IGNAV_API_KEY
        sync: false
      - key: IGNAV_LIFETIME_LIMIT
        value: "1000"
      - key: IGNAV_STRICT_RELEASE
        value: "1"
      - key: IGNAV_FREE_ACCOUNT_ATTESTED
        value: "1"
