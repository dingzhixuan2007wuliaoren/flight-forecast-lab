<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Destination attractions grouped by type, with source-backed details and airport routes.">
  <title>目的地景点 · Flight Forecast Lab</title>
  <style>
    :root{--navy:#10233e;--blue:#1769cf;--blue50:#f1f7ff;--line:#d9e4ef;--muted:#667b94;--bg:#f3f7fb;--white:#fff;--shadow:0 14px 38px rgba(31,57,87,.1);--focus:0 0 0 3px rgba(23,105,207,.2)}
    *{box-sizing:border-box}body{margin:0;color:var(--navy);background:radial-gradient(circle at 90% 0,#e6f5f5 0,transparent 34%),var(--bg);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.5}button,a{font:inherit}.shell{width:min(1180px,calc(100% - 32px));margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0}.brand,.back{color:var(--navy);text-decoration:none;font-weight:800}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.top-actions{display:flex;align-items:center;gap:10px}.back{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12px}.language{display:flex;padding:3px;border:1px solid var(--line);border-radius:11px;background:#fff}.language button{min-height:32px;padding:5px 11px;border:0;border-radius:8px;color:var(--muted);background:transparent;font-size:11px;font-weight:750}.language button[aria-pressed=true]{color:#fff;background:var(--navy)}
    .hero{display:flex;justify-content:space-between;gap:24px;padding:28px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(130deg,#fff 0,#edf6ff 100%);box-shadow:var(--shadow)}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.hero h1{margin:7px 0 8px;font-size:clamp(26px,4vw,42px);line-height:1.12}.hero p{max-width:720px;margin:0;color:var(--muted);font-size:13px}.airport{align-self:flex-start;padding:8px 12px;border-radius:999px;color:#0d705c;background:#dcf6ef;font-size:11px;font-weight:800}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:24px 0 14px}.categories{display:flex;gap:7px;overflow-x:auto;padding:3px}.category{min-height:36px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:#fff;font-size:11px;font-weight:750;white-space:nowrap}.category[aria-pressed=true]{color:#fff;border-color:var(--blue);background:var(--blue)}.category:focus-visible,.place-card:focus-visible,.back:focus-visible,.language button:focus-visible{outline:none;box-shadow:var(--focus)}.count{color:var(--muted);font-size:11px;white-space:nowrap}.state{margin:18px 0;padding:15px 17px;border:1px solid var(--line);border-radius:13px;color:var(--muted);background:#fff;font-size:12px}.state.error{color:#8b3b24;border-color:#efc9b9;background:#fff7f2}.state[hidden]{display:none}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-bottom:32px}.place-card{display:flex;min-height:210px;flex-direction:column;padding:18px;color:inherit;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 7px 22px rgba(31,57,87,.07);text-decoration:none;transition:.16s ease}.place-card:hover{transform:translateY(-2px);border-color:#9ec4f0;box-shadow:0 12px 28px rgba(31,57,87,.12)}.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.type{padding:4px 8px;border-radius:999px;color:var(--blue);background:var(--blue50);font-size:9px;font-weight:800;text-transform:uppercase}.arrow{color:var(--blue);font-weight:900}.place-card h2{margin:14px 0 7px;font-size:17px;line-height:1.3}.place-card p{display:-webkit-box;overflow:hidden;margin:0;color:var(--muted);font-size:11px;-webkit-box-orient:vertical;-webkit-line-clamp:4}.rating-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}.rating-pill{padding:4px 7px;color:#0c765e;border:1px solid #bee4d8;border-radius:999px;background:#f2fcf9;font-size:9px;font-weight:750}.rating-pill.unavailable{color:var(--muted);border-color:var(--line);background:#f8fbfe}.meta{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:auto;padding-top:16px;color:var(--muted);font-size:10px}.source-note{margin:0 0 30px;padding-top:14px;color:var(--muted);border-top:1px solid var(--line);font-size:10px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.shell{width:min(100% - 20px,1180px)}.topbar{align-items:flex-start}.top-actions{align-items:flex-end;flex-direction:column}.hero{padding:21px;flex-direction:column}.airport{align-self:flex-start}.toolbar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/"><span>Flight Forecast Lab</span><small>Destination guide</small></a>
      <div class="top-actions">
        <a id="back-link" class="back" href="/" data-i18n="back">← 返回航班比较</a>
        <div class="language" role="group" aria-label="Language / 语言"><button type="button" data-lang="zh" aria-pressed="true">中文</button><button type="button" data-lang="en" aria-pressed="false">English</button></div>
      </div>
    </header>
    <main>
      <section class="hero" aria-labelledby="title">
        <div><div class="eyebrow" data-i18n="eyebrow">目的地指南 · 真实来源</div><h1 id="title" data-i18n="title">目的地游玩景点</h1><p id="summary" data-i18n="summary">按类型探索景点。点击任一选项可查看具体资料，以及从到达机场出发的驾车、骑行、步行和可用公共交通信息。</p></div>
        <span id="airport" class="airport">—</span>
      </section>
      <div class="toolbar">
        <div id="categories" class="categories" role="group" aria-label="景点类型"></div>
        <span id="count" class="count"></span>
      </div>
      <div id="coverage-note" class="state" role="status" aria-live="polite" hidden></div>
      <div id="state" class="state" role="status" aria-live="polite" data-i18n="loading">正在获取目的地景点…</div>
      <section id="grid" class="grid" aria-live="polite"></section>
      <p id="source-note" class="source-note"></p>
    </main>
  </div>
  <script>
    (function(){
      "use strict";
      var copy={zh:{back:"← 返回航班比较",eyebrow:"目的地指南 · 真实来源",title:"目的地游玩景点",summary:"浏览目的地城市中心周边 30 公里的公开来源景点。分块查询会保留成功分块，点击景点可查看真实介绍、可获得的平台评分及机场交通。",loading:"正在分块获取目的地景点与公开介绍…",failed:"暂时无法获取景点资料。航班结果不受影响，请稍后重试。",empty:"该类别暂无数据源已确认的景点。",missing:"数据源未提供",items:"显示 {count} 个景点",source:"来源：{source}",observed:"观测时间：{time}",address:"地址",rating:"评分",ratingsUnavailable:"公开来源未提供平台评分",reviews:"{count} 条评价",all:"全部",landmark:"地标",museum:"博物馆",nature:"自然景观",entertainment:"娱乐",shopping:"购物"},en:{back:"← Back to flight comparison",eyebrow:"Destination guide · sourced data",title:"Things to do",summary:"Browse public-source attractions within 30 km of the destination city centre. Chunked queries retain successful areas; open a place for its sourced introduction, available platform scores, and airport transport.",loading:"Loading destination attractions and sourced introductions by area…",failed:"Attraction data is temporarily unavailable. Flight results are unaffected; please try again later.",empty:"No source-confirmed attraction is available in this category.",missing:"Not provided by the data source",items:"Showing {count} attractions",source:"Source: {source}",observed:"Observed: {time}",address:"Address",rating:"Rating",ratingsUnavailable:"No public platform score was supplied",reviews:"{count} reviews",all:"All",landmark:"Landmarks",museum:"Museums",nature:"Nature",entertainment:"Entertainment",shopping:"Shopping"}};
      var params=new URLSearchParams(location.search),destination=String(params.get("destination")||"").toUpperCase(),departureDate=String(params.get("departure_date")||"").slice(0,10),language=params.get("lang")==="en"?"en":"zh",active="all",places=[],metadata=null;
      var allowedCategories=["all","landmark","museum","nature","entertainment","shopping"];
      var requestTimeoutMs=65000;
      function el(tag,className,text){var node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
      function tr(key,values){var value=copy[language][key]||key;Object.keys(values||{}).forEach(function(name){value=value.replace("{"+name+"}",String(values[name]))});return value}
      function localized(input){if(input&&typeof input==="object"&&!Array.isArray(input))return input[language]||input.en||input.zh||input.name||input.display_name||"";return input}
      function value(input,fallback){input=localized(input);return input===null||input===undefined||String(input).trim()===""?(fallback===undefined?tr("missing"):fallback):String(input)}
      function cityName(input,fallback){if(input&&typeof input==="object"&&!Array.isArray(input))return value(input.name||input.display_name||input.city,fallback);return value(input,fallback)}
      function placeName(place){return value(language==="en"&&place&&place.name_en?place.name_en:place&&(place.name||place.title))}
      function placeDescription(place){return value(language==="en"&&place&&place.description_en?place.description_en:(language==="zh"&&place&&place.description_zh?place.description_zh:place&&(place.short_description||place.description||place.address)))}
      function ratingPlatform(rating){return value(language==="en"&&rating&&rating.platform_en?rating.platform_en:(language==="zh"&&rating&&rating.platform_zh?rating.platform_zh:rating&&rating.platform))}
      function categoryOf(place){var key=String(place&&((place.category||place.type||place.place_type))||"").toLowerCase().replace(/[^a-z_]/g,"_");return allowedCategories.indexOf(key)>=0?key:""}
      function validDestination(){return /^[A-Z]{3}$/.test(destination)}
      function setState(message,isError){var state=document.getElementById("state");state.hidden=!message;state.textContent=message||"";state.className="state"+(isError?" error":"")}
      function applyLanguage(next){language=next==="en"?"en":"zh";document.documentElement.lang=language==="zh"?"zh-CN":"en";document.querySelectorAll("[data-i18n]").forEach(function(node){var key=node.getAttribute("data-i18n");if(copy[language][key])node.textContent=copy[language][key]});document.querySelectorAll("[data-lang]").forEach(function(button){button.setAttribute("aria-pressed",String(button.dataset.lang===language))});try{localStorage.setItem("flight-forecast-language",language)}catch(error){}renderCategories();renderPlaces();renderMetadata();updateUrl()}
      function updateUrl(){var next=new URLSearchParams(params);next.set("lang",language);history.replaceState(null,"",location.pathname+"?"+next.toString())}
      function renderCategories(){var box=document.getElementById("categories");box.replaceChildren();allowedCategories.forEach(function(key){var button=el("button","category",tr(key));button.type="button";button.dataset.category=key;button.setAttribute("aria-pressed",String(active===key));button.addEventListener("click",function(){active=key;renderCategories();renderPlaces()});box.appendChild(button)})}
      function placeId(place){return value(place&&(place.id||place.place_id||place.osm_id),"")}
      function detailHref(place){var next=new URLSearchParams({destination:destination,kind:"attraction",place_id:placeId(place),lang:language});if(/^\d{4}-\d{2}-\d{2}$/.test(departureDate))next.set("departure_date",departureDate);return "/details/place?"+next.toString()}
      function renderPlaces(){var grid=document.getElementById("grid");grid.replaceChildren();var visible=places.filter(function(place){return placeId(place)&&(active==="all"||categoryOf(place)===active)});document.getElementById("count").textContent=tr("items",{count:visible.length});visible.forEach(function(place){var card=el("a","place-card");card.href=detailHref(place);var top=el("div","card-top");var category=categoryOf(place);top.appendChild(el("span","type",category?tr(category):tr("missing")));top.appendChild(el("span","arrow","→"));card.appendChild(top);card.appendChild(el("h2","",placeName(place)));card.appendChild(el("p","",placeDescription(place)));var ratingRow=el("div","rating-row"),ratings=Array.isArray(place&&place.ratings)?place.ratings:[];if(ratings.length){ratings.forEach(function(rating){var text=ratingPlatform(rating)+" · "+value(rating.score_text);var count=Number(rating.review_count);if(Number.isFinite(count))text+=" · "+tr("reviews",{count:Math.round(count).toLocaleString(language==="zh"?"zh-CN":"en-US")});ratingRow.appendChild(el("span","rating-pill",text))})}else{ratingRow.appendChild(el("span","rating-pill unavailable",tr("ratingsUnavailable")))}card.appendChild(ratingRow);var meta=el("div","meta");meta.appendChild(el("span","",tr("address")+" · "+value(place&&place.address)));meta.appendChild(el("span","",destination));card.appendChild(meta);grid.appendChild(card)});if(metadata&&!visible.length)setState(tr("empty"),false);else if(metadata)setState("",false)}
      function coverageText(){if(!metadata)return"";var supplied=value(metadata.coverage_notice,"");if(supplied)return supplied;var succeeded=Number(metadata.query_parts_succeeded),total=Number(metadata.query_parts_total),truncated=metadata.provider_truncated===true;if(Number.isFinite(succeeded)&&Number.isFinite(total)&&total>0){if(truncated)return language==="zh"?"已完成 "+succeeded+"/"+total+" 个分块，但公开来源或本地 300 条安全上限发生截断；结果不是完整城市全量。":"Completed "+succeeded+"/"+total+" query tiles, but the public source or the local 300-place safety limit truncated the result; this is not a complete city inventory.";if(succeeded<total)return language==="zh"?"已完成 "+succeeded+"/"+total+" 个分块；未成功的分块造成空间覆盖缺口。":"Completed "+succeeded+"/"+total+" query tiles; unsuccessful tiles leave gaps in geographic coverage.";return language==="zh"?"已完成全部 "+total+" 个分块；范围仍限目的地中心周边 30 公里且最多 300 条。":"Completed all "+total+" query tiles; coverage is still limited to 30 km around the destination centre and at most 300 places."}var radius=Number(metadata.coverage_radius_km);if(!Number.isFinite(radius))return"";return language==="zh"?"实际成功查询覆盖半径："+radius+" 公里。":"Actual successfully queried coverage radius: "+radius+" km."}
      function renderMetadata(){var source=document.getElementById("source-note"),coverage=document.getElementById("coverage-note");if(!metadata){source.textContent="";coverage.hidden=true;coverage.textContent="";return}var parts=[tr("source",{source:value(metadata.source)})];if(metadata.observed_at)parts.push(tr("observed",{time:new Date(metadata.observed_at).toLocaleString(language==="zh"?"zh-CN":"en-CA")}));source.textContent=parts.join(" · ");var notice=coverageText();coverage.hidden=!notice;coverage.textContent=notice;coverage.dataset.coverageStatus=value(metadata.coverage_status,"");var city=cityName(metadata.city,destination);document.getElementById("airport").textContent=city+" · "+value(metadata.destination_airport,destination);document.title=(city+" · "+tr("title")+" · Flight Forecast Lab")}
      async function fetchJson(url,options){var controller=new AbortController(),timeout=window.setTimeout(function(){controller.abort()},requestTimeoutMs);try{var request=Object.assign({},options,{signal:controller.signal}),response=await fetch(url,request);if(!response.ok)throw new Error("HTTP "+response.status);return await response.json()}finally{window.clearTimeout(timeout)}}
      async function load(){if(!validDestination()){setState(tr("failed"),true);return}document.getElementById("airport").textContent=destination;setState(tr("loading"),false);try{var data=await fetchJson("/v1/destination/places",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({destination:destination,kind:"attraction",limit:300,language:language})});places=Array.isArray(data&&data.places)?data.places:[];metadata={city:data&&data.city,destination_airport:data&&(data.destination_airport||(data.city&&data.city.destination_airport)),source:data&&(data.source||data.data_source),observed_at:data&&(data.observed_at||data.fetched_at),status:data&&data.status,coverage_radius_km:data&&data.coverage_radius_km,coverage_status:data&&data.coverage_status,coverage_reason:data&&data.coverage_reason,partial:data&&data.partial,coverage_notice:data&&data.coverage_notice,query_parts_succeeded:data&&data.query_parts_succeeded,query_parts_total:data&&data.query_parts_total,provider_truncated:data&&data.provider_truncated,available_result_count:data&&data.available_result_count};renderMetadata();renderPlaces()}catch(error){metadata=null;places=[];renderMetadata();renderPlaces();setState(tr("failed"),true)}}
      document.querySelectorAll("[data-lang]").forEach(function(button){button.addEventListener("click",function(){if(button.dataset.lang!==language)applyLanguage(button.dataset.lang)})});try{if(!params.has("lang"))language=localStorage.getItem("flight-forecast-language")==="en"?"en":language}catch(error){}document.getElementById("back-link").href="/";renderCategories();applyLanguage(language);load();
    }());
  </script>
</body>
</html>
