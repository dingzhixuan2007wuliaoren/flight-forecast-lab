      function priceFailureText(error){var detail=error&&error.detail,code=errorCode(error),key={not_configured:"notConfigured",authentication_failed:"authenticationFailed",quota_exhausted:"quotaExhausted",rate_limited:"quotaExhausted",provider_processing:"providerProcessing",provider_error:"providerError",provider_unavailable:"providerUnavailable",quota_ledger_unavailable:"providerUnavailable",response_invalid:"responseInvalid"}[code],base=key?tr(key):tr("priceFailed"),runs=providerRunSummary(detail);return[base,runs].filter(Boolean).join(" ")}
      function placeFailureText(error){var code=errorCode(error),key={destination_quota_exhausted:"placeQuotaFailed",destination_rate_limited:"placeRateFailed",destination_timeout:"placeTimeoutFailed",destination_request_budget_exhausted:"placeTimeoutFailed",destination_invalid_response:"placeInvalidFailed"}[code];return tr(key||"failed")}
      async function loadPlaces(){if(!/^[A-Z]{3}$/.test(destination)){setState(tr("failed"),true);return}document.getElementById("airport").textContent=destination;setState(tr("loading"),false);try{var data=await fetchJson("/v1/destination/places",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({destination:destination,kind:"hotel",language:language})});places=Array.isArray(data&&data.places)?data.places:[];metadata={city:data&&data.city,destination_airport:data&&(data.destination_airport||(data.city&&data.city.destination_airport)),source:data&&(data.source||data.data_source),observed_at:data&&(data.observed_at||data.fetched_at),status:data&&data.status,coverage_radius_km:data&&data.coverage_radius_km,coverage_status:data&&data.coverage_status,coverage_reason:data&&data.coverage_reason,partial:data&&data.partial,coverage_notice:data&&data.coverage_notice};renderMetadata();renderPlaces()}catch(error){metadata=null;places=[];renderMetadata();renderPlaces();setState(placeFailureText(error),true)}}
      async function queryPrices(event){event.preventDefault();var checkIn=document.getElementById("check-in").value,checkOut=document.getElementById("check-out").value,adults=Number(document.getElementById("adults").value);if(!/^\d{4}-\d{2}-\d{2}$/.test(checkIn)||!/^\d{4}-\d{2}-\d{2}$/.test(checkOut)||checkOut<=checkIn||!Number.isInteger(adults)||adults<1||adults>8){document.getElementById("quota-warning").hidden=false;document.getElementById("quota-warning").textContent=tr("invalidStay");return}var button=document.getElementById("price-button");button.disabled=true;button.textContent=tr("querying");document.getElementById("quota-warning").hidden=true;try{priceData=await fetchJson("/v1/destination/hotel-prices",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({destination:destination,check_in:checkIn,check_out:checkOut,adults:adults,language:language==="zh"?"zh-cn":"en"})});renderPrices(priceData)}catch(error){priceData=null;document.getElementById("priced-wrap").hidden=false;document.getElementById("priced-grid").replaceChildren(el("div","state error",priceFailureText(error)))}finally{button.disabled=false;button.textContent=tr("queryPrice")}}
      var initialCheckIn=/^\d{4}-\d{2}-\d{2}$/.test(departureDate)?departureDate:iso(new Date());document.getElementById("check-in").value=initialCheckIn;document.getElementById("check-out").value=addDay(initialCheckIn);document.getElementById("price-form").addEventListener("submit",queryPrices);document.querySelectorAll("[data-lang]").forEach(function(button){button.addEventListener("click",function(){if(button.dataset.lang!==language)applyLanguage(button.dataset.lang)})});try{if(!params.has("lang"))language=localStorage.getItem("flight-forecast-language")==="en"?"en":language}catch(error){}renderCategories();applyLanguage(language);loadPlaces();
    }());
  </script>
