<!doctype html>
<html lang="zh-CN">

  <style>

ff}.route .mode{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--blue);font-size:11px;font-weight:800}.route strong{display:block;margin:13px 0 2px;font-size:24px;line-height:1}.route p{margin:0;color:var(--muted);font-size:10px}.transit{margin-top:12px;padding:13px 15px;border:1px solid #ead49a;border-radius:13px;color:#755611;background:#fff9e8;font-size:11px}.price-panel{padding:18px;border:1px solid #bee4d8;border-radius:16px;background:#f2fcf9}.price-panel[hidden]{display:none}.price-panel h2{margin:0 0 5px;font-size:17px}.price-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.price-box{padding:13px;border:1px solid #bee4d8;border-radius:12px;background:#fff}.price-box span{display:block;color:var(--muted);font-size:9px;font-weight:750;text-transform:uppercase}.price-main{margin:5px 0 0;color:var(--green);font-size:22px;font-weight:850}.price-meta{color:var(--muted);font-size:10px}.warning{margin-top:12px;padding:10px 12px;border:1px solid #ebd39a;border-radius:10px;color:var(--amber);background:#fff8e7;font-size:10px}.source{margin:28px 0;padding:15px 0;color:var(--muted);border-top:1px solid var(--line);font-size:10px}@media(max-width:760px){.facts,.routes{grid-template-columns:1fr}.fact.wide{grid-column:auto}.hero-top,.section-head{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.shell{width:min(100% - 20px,1080px)}.topbar{align-items:flex-start}.top-actions{align-items:flex-end;flex-direction:column}.hero{padding:21px}.price-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="/"><span>Flight Forecast Lab</span><small>Destination guide</small></a><div class="top-actions"><a id="back-link" class="back" href="/" data-i18n="back">← 返回列表</a><div class="language" role="group" aria-label="Language / 语言"><button type="button" data-lang="zh" aria-pressed="true">中文</button><button type="button" data-lang="en" aria-pressed="false">English</button></div></div></header>

      <section id="price-panel" class="price-panel section" hidden aria-labelledby="price-title"><h2 id="price-title" data-i18n="realPrice">本次住宿真实报价</h2><div class="price-grid"><div class="price-box"><span data-i18n="nightlyPrice">每晚价格</span><p id="nightly-price" class="price-main">—</p></div><div class="price-box"><span data-i18n="totalPrice">住宿总价</span><p id="total-price" class="price-main">—</p></div></div><p id="price-meta" class="price-meta"></p><p id="price-warning" class="warning" hidden></p></section>
      <section class="section" aria-labelledby="routes-title"><div class="section-head"><div><h2 id="routes-title" data-i18n="routesTitle">从到达机场前往这里</h2><p data-i18n="routesHint">以下时间是路线服务给出的预计时间，不代表实时路况。</p></div></div><div id="routes" class="routes"></div><p id="transit" class="transit"></p></section>
      <p id="source" class="source"></p>
    </div></main>
  </div>
  <script>

      function routeMap(routes){var map={};if(Array.isArray(routes)){routes.forEach(function(route){var mode=String(route&&(route.mode||route.profile||route.type)||"").toLowerCase();if(mode==="bike"||mode==="cycling")mode="bicycle";if(mode==="driving")mode="car";if(mode==="walking")mode="foot";if(mode)map[mode]=route})}else if(routes&&typeof routes==="object"){["car","bicycle","bike","foot","public_transit"].forEach(function(mode){if(routes[mode])map[mode==="bike"?"bicycle":mode]=routes[mode]})}return map}
      function renderRoutes(routes,notice){var box=document.getElementById("routes"),map=routeMap(routes);box.replaceChildren();["car","bicycle","foot"].forEach(function(mode){var route=map[mode]||{},card=el("article","route"),head=el("div","mode");head.appendChild(el("span","",tr(mode)));head.appendChild(el("span","",mode==="car"?"●":mode==="bicycle"?"◆":"■"));card.appendChild(head);var minutes=numeric(route.duration_minutes!==undefined?route.duration_minutes:route.minutes),distance=numeric(route.distance_km!==undefined?route.distance_km:route.distance);card.appendChild(el("strong","",minutes===null?tr("missing"):tr("minutes",{value:Math.round(minutes)})));card.appendChild(el("p","",distance===null?tr("routeUnavailable"):tr("distance",{value:distance.toLocaleString(language==="zh"?"zh-CN":"en-CA",{maximumFractionDigits:1})})));box.appendChild(card)});var transit=map.public_transit||{},transitText=language==="zh"?tr("transitUnavailable"):value(notice||transit.notice,tr("transitUnavailable"));document.getElementById("transit").textContent=transitText}

      function renderHotelDetails(place){var isHotel=kind==="hotel"||kind==="priced_hotel"||place&&place.kind==="hotel",section=document.getElementById("hotel-details");section.hidden=!isHotel;if(!isHotel)return;var hotelClass=place&&(place.hotel_class!==undefined?place.hotel_class:place.stars),reviewCount=numeric(place&&place.review_count),amenities=Array.isArray(place&&place.amenities)?place.amenities.filter(function(item){return typeof item==="string"&&item.trim()}).slice(0,40):[];document.getElementById("hotel-class").textContent=hotelClass===null||hotelClass===undefined?tr("missing"):tr("stars",{value:hotelClass});document.getElementById("review-count").textContent=reviewCount===null?tr("missing"):tr("reviews",{value:Math.round(reviewCount).toLocaleString(language==="zh"?"zh-CN":"en-US")});document.getElementById("amenities").textContent=amenities.length?amenities.join(" · "):tr("missing");document.getElementById("free-cancellation").textContent=place&&place.free_cancellation===true?tr("yes"):(place&&place.free_cancellation===false?tr("no"):tr("missing"))}
