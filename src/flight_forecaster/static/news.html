      function applyLanguage(next){lang=next==="en"?"en":"zh";document.documentElement.lang=lang==="zh"?"zh-CN":"en";document.title=(lang==="zh"?"新闻详情":"News detail")+" · Flight Forecast Lab";document.querySelectorAll("[data-i18n]").forEach(function(node){node.textContent=t(node.dataset.i18n)});document.querySelectorAll(".language button").forEach(function(button){button.setAttribute("aria-pressed",String(button.dataset.lang===lang))});params.set("lang",lang);history.replaceState(null,"",location.pathname+"?"+params.toString());try{localStorage.setItem("flight-forecast-language",lang)}catch(e){}if(data)render(data)}
      q("back").addEventListener("click",function(event){if(history.length>1){event.preventDefault();history.back()}});q("refresh").addEventListener("click",load);document.querySelectorAll(".language button").forEach(function(button){button.addEventListener("click",function(){applyLanguage(button.dataset.lang)})});try{lang=params.get("lang")||localStorage.getItem("flight-forecast-language")||"zh"}catch(e){lang=params.get("lang")||"zh"}applyLanguage(lang);load();refreshTimer=setInterval(load,900000);window.addEventListener("pagehide",function(){clearInterval(refreshTimer)});
    }());
  </script>
