      function hourlySection(points,tz){points=Array.isArray(points)?points:[];var wrap=el("section","chart-wrap"),head=append(wrap,"div","section-title"),left=append(head,"div");append(left,"h3","",t("hourly"));append(left,"p","",t("hourlyHint"));var legend=append(wrap,"div","legend"),a=append(legend,"span");var ai=append(a,"i");ai.style.background="#1768e4";a.appendChild(document.createTextNode(t("temperatureLine")));var b=append(legend,"span");var bi=append(b,"i");bi.style.background="#d64854";b.appendChild(document.createTextNode(t("riskLine")));if(!points.length){append(wrap,"div","empty",t("noHourly"));return wrap}var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("class","chart");svg.setAttribute("role","img");svg.setAttribute("aria-label",t("hourly"));wrap.appendChild(svg);drawChart(svg,points,tz);var sc=append(wrap,"div","table-scroll"),table=append(sc,"table"),thead=append(table,"thead"),tr=append(thead,"tr");["time","temp","code","wind","gust","precip","precipChance","visibility","risk"].forEach(function(k){append(tr,"th","",t(k))});var body=append(table,"tbody");points.forEach(function(p){var row=append(body,"tr");[date(p.time,tz),weatherValue(p.temperature_c,"°C"),text(p.weather_code),weatherValue(p.wind_speed_kmh,t("kmh")),weatherValue(p.wind_gust_kmh,t("kmh")),weatherValue(p.precipitation_mm,t("mm")),weatherValue(p.precipitation_probability_pct,"%",0),weatherValue(p.visibility_m,t("meters"),0),riskInfo(p.risk).value].forEach(function(v){append(row,"td","",v)})});return wrap}
